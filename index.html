<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyectos KathWare</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 2rem;
      background-color: #fff;
      color: #111;
    }

    h1, h2 {
      text-align: center;
    }

    .proyecto {
      background-color: #f0f4f8;
      border-left: 5px solid #007bff;
      padding: 1rem;
      margin-bottom: 2rem;
      border-radius: 6px;
    }

    .proyecto h3 {
      margin-top: 0;
    }

    .proyecto a {
      color: #007bff;
      text-decoration: none;
    }

    .proyecto a:hover {
      text-decoration: underline;
    }

    .markdown {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background-color: #ffffff;
      border-left: 3px solid #aaa;
    }

    .enlace-blog {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.95rem;
      color: #333;
    }
  
    .proyecto { color:#111; }
    .proyecto-header { display:flex; flex-wrap:wrap; align-items:baseline; gap:.5rem; }
    .project-version { font-weight:700; margin:.65rem 0; }
    .project-status { border:1px solid #555; border-radius:999px; padding:.1rem .55rem; font-size:.9rem; }
    .project-status.archived { background:#e9e9e9; }
    .project-details { margin-top:.75rem; border:1px solid #777; border-radius:6px; padding:.5rem .75rem; background:#fff; }
    .project-details summary { cursor:pointer; font-weight:700; padding:.35rem 0; }
    .markdown h1,.markdown h2,.markdown h3,.markdown h4 { text-align:left; }
    .markdown pre,.markdown table { max-width:100%; overflow:auto; }
    .markdown pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#f5f5f5; padding:.75rem; }
    .markdown code { overflow-wrap:anywhere; }
    .markdown table { display:block; border-collapse:collapse; }
    .markdown th,.markdown td { border:1px solid #777; padding:.4rem; text-align:left; }
    .markdown img { max-width:100%; height:auto; }
    .markdown a { overflow-wrap:anywhere; }
    .markdown blockquote { margin-left:.75rem; padding-left:.75rem; border-left:3px solid #777; }
    .mensaje-error { color:#111; background:#fff4d1; border:2px solid #7a5600; padding:1rem; }

  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" defer></script>
</head>
<body>

  <p class="enlace-blog">
    También podés visitar:  
    <a href="https://kathware.com.ar/proyectos/" target="_blank">Proyectos en el blog de KathWare</a>
  </p>

  <h1>Proyectos de KathWare en GitHub</h1>
  <h2>Repositorios públicos</h2>
  <div id="versiones" role="status" aria-live="polite">Cargando proyectos desde GitHub...</div>

  <script>
    const usuarioGitHub = "dragonmoon1522";
    const repoPrincipal = usuarioGitHub + ".github.io";
    let converter = null;
    function crearConversor() {
      return new showdown.Converter({
        tables: true,
        strikethrough: true,
        tasklists: true,
        ghCodeBlocks: true,
        simplifiedAutoLink: true
      });
    }
    const archivosReadme = ["README.md", "readme.md", "Readme.md"];
    const archivosVersion = ["version.md", "VERSION.md", "Version.md"];

    async function leerMarkdown(baseURL, nombres) {
      for (const nombre of nombres) {
        try {
          const respuesta = await fetch(baseURL + nombre, { cache: "no-store" });
          if (respuesta.ok) return { nombre, texto: await respuesta.text() };
        } catch (_) {}
      }
      return null;
    }

    function obtenerVersion(texto) {
      const coincidencia = texto.match(/\b\d+\.\d+\.\d+\b/) || texto.match(/\b\d+\.\d+\b/);
      return coincidencia ? coincidencia[0] : "";
    }

    function fragmentoMarkdown(texto, repo, rama, archivo, sufijo) {
      const contenedor = document.createElement("div");
      contenedor.className = "markdown";
      if (!window.showdown || !window.DOMPurify) {
        const respaldo = document.createElement("pre");
        respaldo.textContent = texto;
        contenedor.appendChild(respaldo);
        return contenedor;
      }

      const htmlSeguro = DOMPurify.sanitize(converter.makeHtml(texto), {
        USE_PROFILES: { html: true }
      });
      contenedor.innerHTML = htmlSeguro;

      const ramaURL = rama.split("/").map(encodeURIComponent).join("/");
      const archivoRaw = "https://raw.githubusercontent.com/" + usuarioGitHub + "/" +
        encodeURIComponent(repo) + "/" + ramaURL + "/" + archivo;
      const archivoGitHub = "https://github.com/" + usuarioGitHub + "/" +
        encodeURIComponent(repo) + "/blob/" + ramaURL + "/" + archivo;
      const prefijo = "repo-" + repo.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + sufijo;
      const mapaIds = new Map();

      contenedor.querySelectorAll("[id]").forEach(function (nodo) {
        const anterior = nodo.id;
        const nuevo = prefijo + "-" + anterior;
        mapaIds.set(anterior, nuevo);
        nodo.id = nuevo;
      });

      contenedor.querySelectorAll('a[href^="#"]').forEach(function (enlace) {
        const anterior = decodeURIComponent(enlace.getAttribute("href").slice(1));
        if (mapaIds.has(anterior)) enlace.setAttribute("href", "#" + mapaIds.get(anterior));
      });

      contenedor.querySelectorAll("a[href]").forEach(function (enlace) {
        const href = enlace.getAttribute("href");
        if (!href || href.startsWith("#")) return;
        try {
          const destino = new URL(href, archivoGitHub);
          if (!["http:", "https:", "mailto:"].includes(destino.protocol)) {
            enlace.removeAttribute("href");
            return;
          }
          enlace.href = destino.href;
          enlace.target = "_blank";
          enlace.rel = "noopener noreferrer";
        } catch (_) {
          enlace.removeAttribute("href");
        }
      });

      contenedor.querySelectorAll("img[src]").forEach(function (imagen) {
        try {
          const destino = new URL(imagen.getAttribute("src"), archivoRaw);
          if (destino.protocol === "https:") imagen.src = destino.href;
          else imagen.removeAttribute("src");
        } catch (_) {
          imagen.removeAttribute("src");
        }
      });
      return contenedor;
    }

    function agregarDetalle(tarjeta, titulo, contenido, repo, rama, archivo, sufijo) {
      if (!contenido) return;
      const detalle = document.createElement("details");
      detalle.className = "project-details";
      const resumen = document.createElement("summary");
      resumen.textContent = titulo;
      detalle.appendChild(resumen);
      detalle.appendChild(fragmentoMarkdown(contenido.texto, repo, rama, contenido.nombre, sufijo));
      tarjeta.appendChild(detalle);
    }

    async function cargarProyecto(repo) {
      const rama = repo.default_branch || "main";
      const ramaURL = rama.split("/").map(encodeURIComponent).join("/");
      const baseURL = "https://raw.githubusercontent.com/" + usuarioGitHub + "/" +
        encodeURIComponent(repo.name) + "/" + ramaURL + "/";
      const resultados = await Promise.all([
        leerMarkdown(baseURL, archivosReadme),
        leerMarkdown(baseURL, archivosVersion)
      ]);
      return {
        repo: repo,
        rama: rama,
        readme: resultados[0],
        versiones: resultados[1],
        numeroVersion: resultados[1] ? obtenerVersion(resultados[1].texto) : ""
      };
    }

    function crearTarjeta(proyecto) {
      const repo = proyecto.repo;
      const tarjeta = document.createElement("article");
      tarjeta.className = "proyecto";

      const encabezado = document.createElement("div");
      encabezado.className = "proyecto-header";
      const titulo = document.createElement("h3");
      const enlaceRepo = document.createElement("a");
      enlaceRepo.href = repo.html_url;
      enlaceRepo.target = "_blank";
      enlaceRepo.rel = "noopener noreferrer";
      enlaceRepo.textContent = repo.name;
      titulo.appendChild(enlaceRepo);
      encabezado.appendChild(titulo);

      if (repo.archived) {
        const estado = document.createElement("span");
        estado.className = "project-status archived";
        estado.textContent = "Archivado";
        encabezado.appendChild(estado);
      }
      tarjeta.appendChild(encabezado);

      if (repo.description) {
        const descripcion = document.createElement("p");
        descripcion.textContent = repo.description;
        tarjeta.appendChild(descripcion);
      }

      if (proyecto.numeroVersion) {
        const version = document.createElement("p");
        version.className = "project-version";
        version.textContent = "Versión identificada: " + proyecto.numeroVersion;
        tarjeta.appendChild(version);
      }

      agregarDetalle(tarjeta, "README (vista HTML)", proyecto.readme, repo.name, proyecto.rama, "README.md", "readme");
      agregarDetalle(tarjeta, "Historial de versiones (vista HTML)", proyecto.versiones, repo.name, proyecto.rama, "version.md", "versiones");

      if (!proyecto.readme) {
        const nota = document.createElement("p");
        nota.textContent = "No se encontró un README en la rama " + proyecto.rama + ".";
        tarjeta.appendChild(nota);
      }
      if (!proyecto.versiones) {
        const nota = document.createElement("p");
        nota.textContent = "Este repositorio no tiene un archivo version.md.";
        tarjeta.appendChild(nota);
      }
      return tarjeta;
    }

    async function obtenerRepositorios() {
      const contenedor = document.getElementById("versiones");
      try {
        const respuesta = await fetch(
          "https://api.github.com/users/" + usuarioGitHub + "/repos?per_page=100&sort=updated",
          { headers: { Accept: "application/vnd.github+json" } }
        );
        if (!respuesta.ok) throw new Error("GitHub respondió " + respuesta.status);
        const repos = await respuesta.json();
        const visibles = repos.filter(function (repo) {
          return !repo.private && repo.name !== repoPrincipal;
        });
        const proyectos = await Promise.all(visibles.map(cargarProyecto));
        contenedor.replaceChildren();

        if (!proyectos.length) {
          contenedor.textContent = "No hay repositorios públicos para mostrar.";
          return;
        }
        proyectos.forEach(function (proyecto) {
          contenedor.appendChild(crearTarjeta(proyecto));
        });
        contenedor.setAttribute("role", "region");
        contenedor.removeAttribute("aria-live");
      } catch (_) {
        contenedor.className = "mensaje-error";
        contenedor.textContent = "No se pudo cargar la lista de repositorios públicos de GitHub.";
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (window.showdown) converter = crearConversor();
      obtenerRepositorios();
    });
  </script>

  <hr />
  <footer>
    <p>
      <a href="https://github.com/dragonmoon1522" target="_blank">Ver perfil en GitHub</a> |
      <a href="https://kathware.com.ar/contacto/" target="_blank">Contacto directo</a> |

      <a href="https://kathware.com.ar/lau/" target="_blank">Licencia de Accesibilidad Universal</a>
    </p>
    <p>© 2026 <strong>KathWare</strong> — hecho por Katherine Vargas</p>
  </footer>
</body>
</html>
